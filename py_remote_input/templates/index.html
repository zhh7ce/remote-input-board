<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>远程输入板</title>
  <style>
    :root {
      --bg: #eef3f0;
      --ink: #16211d;
      --muted: #65716d;
      --line: #d9e2de;
      --accent: #0f7b5f;
      --danger: #b73535;
      --shadow: 0 18px 42px rgba(20, 38, 31, 0.14);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(15, 123, 95, 0.18), transparent 34%),
        var(--bg);
      padding: 16px;
    }
    .shell { width: min(100%, 720px); margin: 0 auto; display: grid; gap: 14px; }
    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .composerHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    h1 { font-size: 17px; margin: 0; }
    .headerRight { display: flex; align-items: center; gap: 10px; }
    .lockButton {
      min-height: 0;
      padding: 6px 14px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(22, 33, 29, 0.08);
      font-size: 13px;
      font-weight: 700;
    }
    .lockButton:active { background: rgba(183, 53, 53, 0.15); color: var(--danger); }
    textarea {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 16px;
      color: var(--ink);
      background: #fbfdfc;
      font: inherit;
      font-size: 19px;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      overflow-wrap: break-word;
      box-shadow: 0 0 0 4px rgba(15, 123, 95, 0.12);
    }
    .options {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .options input { width: 20px; height: 20px; accent-color: var(--accent); }
    .optionList { display: grid; gap: 8px; padding: 12px 16px; }
    .optionList .options { margin-top: 0; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    button {
      min-height: 56px;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }
    .sendButton { flex: 1; }
    button.secondary { color: var(--accent); background: rgba(15, 123, 95, 0.1); min-width: 96px; font-size: 15px; }
    button:disabled, button[aria-busy="true"] { opacity: 0.62; cursor: wait; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      max-width: min(90vw, 480px);
      padding: 11px 20px;
      border-radius: 999px;
      color: #fff;
      background: rgba(22, 33, 29, 0.92);
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 60;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: rgba(183, 53, 53, 0.95); }
    .historyHeader { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .historyHeader h2 { margin: 0; font-size: 16px; }
    .historyHeader button {
      min-height: 0;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(22, 33, 29, 0.08);
      font-size: 13px;
      font-weight: 700;
    }
    .historyList { display: grid; gap: 8px; max-height: 32vh; overflow: auto; }
    .historyList:empty::after {
      content: "暂无发送记录";
      color: var(--muted);
      font-size: 14px;
      padding: 4px 2px 10px;
    }
    .historyItem {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #fbfdfc;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.45;
      cursor: pointer;
    }
    .historyItem:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 123, 95, 0.12);
      outline: none;
    }

    /* ---------- 锁屏 PIN ---------- */
    .lock-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(15, 123, 95, 0.28), transparent 60%),
        var(--bg);
      transition: opacity 0.25s ease;
    }
    .lock-overlay.hidden { opacity: 0; pointer-events: none; }
    .lock-card { width: min(100%, 380px); display: grid; gap: 22px; justify-items: center; }
    .lock-title { font-size: 24px; font-weight: 800; letter-spacing: 1px; }
    .lock-sub { color: var(--muted); font-size: 14px; margin-top: -14px; text-align: center; }
    .lock-dots { display: flex; gap: 22px; }
    .lock-dots .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: transparent;
      transition: background 0.1s ease, transform 0.1s ease;
    }
    .lock-dots .pin-dot.filled { background: var(--accent); }
    .lock-error { min-height: 20px; color: var(--danger); font-size: 14px; font-weight: 700; }
    .lock-card.shake { animation: pinShake 0.4s ease; }
    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 76px);
      grid-auto-rows: 76px;
      gap: 14px;
      justify-content: center;
    }
    .key {
      border-radius: 50%;
      min-height: 0;
      padding: 0;
      font-size: 30px;
      font-weight: 600;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      box-shadow: 0 4px 12px rgba(20, 38, 31, 0.08);
      user-select: none;
    }
    .key:active { background: rgba(15, 123, 95, 0.18); transform: scale(0.96); }
    .key.spacer { visibility: hidden; pointer-events: none; box-shadow: none; border: 0; background: transparent; }
    .key.back { font-size: 26px; color: var(--muted); }
    @media (max-width: 360px) {
      .keypad { grid-template-columns: repeat(3, 66px); grid-auto-rows: 66px; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="card">
      <div class="composerHeader">
        <h1>远程输入板</h1>
        <div class="headerRight">
          <button class="lockButton" id="lockButton" type="button" title="取消信任本机，下次需要重新输入 PIN">锁定</button>
        </div>
      </div>
      <textarea id="text" placeholder="输入文字…"></textarea>
      <div class="actions">
        <button class="sendButton" id="sendButton" type="button">发送</button>
        <button class="secondary" id="clearButton" type="button">清空</button>
      </div>
    </section>

    <section class="card optionList">
      <label class="options">
        <input type="checkbox" id="sendOnEnter">
        回车直接发送（Shift+回车换行）
      </label>
      <label class="options">
        <input type="checkbox" id="enterWhenEmpty">
        无文字时点发送 = 在电脑上按回车
      </label>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="card">
      <div class="historyHeader">
        <h2>发送记录</h2>
        <button id="clearHistory" type="button">清空记录</button>
      </div>
      <div class="historyList" id="historyList"></div>
    </section>
  </div>

  <!-- 锁屏：手机锁屏样式，只能点按数字键盘，不弹系统键盘 -->
  <div class="lock-overlay" id="lockOverlay">
    <div class="lock-card" id="lockCard">
      <div class="lock-title">输入 PIN</div>
      <div class="lock-sub" id="lockSub">输入电脑端显示的 PIN，仅首次配对需要</div>
      <div class="lock-dots" id="lockDots"></div>
      <div class="lock-error" id="lockError"></div>
      <div class="keypad" id="keypad" role="group" aria-label="PIN 数字键盘"></div>
    </div>
  </div>

  <script>
    const text = document.getElementById("text");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const toastNode = document.getElementById("toast");
    const historyList = document.getElementById("historyList");
    const clearHistoryButton = document.getElementById("clearHistory");
    const sendOnEnterCheckbox = document.getElementById("sendOnEnter");
    const enterWhenEmptyCheckbox = document.getElementById("enterWhenEmpty");
    const lockButton = document.getElementById("lockButton");

    const lockOverlay = document.getElementById("lockOverlay");
    const lockCard = document.getElementById("lockCard");
    const lockDots = document.getElementById("lockDots");
    const lockError = document.getElementById("lockError");
    const keypad = document.getElementById("keypad");

    const HISTORY_STORAGE_KEY = "remoteInput.history";
    const ENTER_MODE_STORAGE_KEY = "remoteInput.sendOnEnter";
    const EMPTY_ENTER_STORAGE_KEY = "remoteInput.enterWhenEmpty";
    const TOKEN_STORAGE_KEY = "remoteInput.token";
    const HISTORY_LIMIT = 20;

    // 下面的 fetch 路径一律相对页面 URL：写成 /api/… 会解析到站点根，绕过网关前缀 /app/remote-input-board。
    let sending = false;
    let pinLength = 6;
    let pinBuffer = "";
    let pinBusy = false;

    let toastTimer = null;
    function showToast(message, isError) {
      toastNode.textContent = message;
      toastNode.classList.toggle("error", !!isError);
      toastNode.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastNode.classList.remove("show"), 1800);
    }

    function getToken() { return localStorage.getItem(TOKEN_STORAGE_KEY); }

    /* ---------- 锁屏 PIN ---------- */
    function renderDots() {
      lockDots.textContent = "";
      for (let i = 0; i < pinLength; i++) {
        const dot = document.createElement("span");
        dot.className = "pin-dot" + (i < pinBuffer.length ? " filled" : "");
        lockDots.appendChild(dot);
      }
    }

    function renderKeypad() {
      keypad.textContent = "";
      const layout = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "back"];
      for (const keyName of layout) {
        const key = document.createElement("button");
        key.type = "button";
        if (keyName === "") {
          key.className = "key spacer";
        } else if (keyName === "back") {
          key.className = "key back";
          key.textContent = "⌫";
          key.setAttribute("aria-label", "删除");
          key.addEventListener("click", pressBackspace);
        } else {
          key.className = "key";
          key.textContent = keyName;
          key.addEventListener("click", () => pressDigit(keyName));
        }
        keypad.appendChild(key);
      }
    }

    function setLockError(message) {
      lockError.textContent = message || "";
      if (message) {
        lockCard.classList.remove("shake");
        void lockCard.offsetWidth;
        lockCard.classList.add("shake");
        if (navigator.vibrate) navigator.vibrate(60);
      }
    }

    function pressDigit(digit) {
      if (pinBusy || pinBuffer.length >= pinLength) return;
      pinBuffer += digit;
      setLockError("");
      renderDots();
      if (navigator.vibrate) navigator.vibrate(8);
      if (pinBuffer.length === pinLength) submitPin();
    }

    function pressBackspace() {
      if (pinBusy) return;
      pinBuffer = pinBuffer.slice(0, -1);
      setLockError("");
      renderDots();
    }

    function resetPinBuffer() {
      pinBuffer = "";
      renderDots();
    }

    async function submitPin() {
      pinBusy = true;
      setLockError("");
      try {
        const response = await fetch("api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: pinBuffer }),
        });
        const payload = await response.json().catch(() => ({}));
        if (response.ok && payload.ok && payload.token) {
          localStorage.setItem(TOKEN_STORAGE_KEY, payload.token);
          unlock();
          return;
        }
        if (response.status === 429) {
          setLockError("尝试次数过多，请 " + (payload.retryAfter || 30) + " 秒后再试");
        } else {
          setLockError("PIN 不正确，请重试");
        }
        resetPinBuffer();
      } catch (error) {
        setLockError("网络错误：" + error.message);
        resetPinBuffer();
      } finally {
        pinBusy = false;
      }
    }

    function showLock() {
      lockOverlay.classList.remove("hidden");
      resetPinBuffer();
    }

    async function lockDevice() {
      const token = getToken();
      if (token) {
        try {
          await fetch("api/logout", { method: "POST", headers: { Authorization: "Bearer " + token } });
        } catch {}
      }
      localStorage.removeItem(TOKEN_STORAGE_KEY);
      showLock();
    }

    lockButton.addEventListener("click", lockDevice);

    function unlock() {
      lockOverlay.classList.add("hidden");
      setLockError("");
      text.focus();
    }

    /* ---------- 发送：token 与内容打在同一个请求里，无连接状态 ---------- */
    async function sendRequest(payload) {
      const token = getToken();
      if (!token) { showLock(); throw new Error("需要配对"); }
      const response = await fetch("api/type?token=" + encodeURIComponent(token), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (response.status === 401) {
        localStorage.removeItem(TOKEN_STORAGE_KEY);
        showLock();
        throw new Error("需要重新输入 PIN");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || "发送失败");
      return data;
    }

    /* ---------- 发送 ---------- */
    async function sendText() {
      if (sending) return;
      if (!localStorage.getItem(TOKEN_STORAGE_KEY)) { showLock(); return; }
      const payloadText = text.value;

      // 没有文字：按复选框决定是触发电脑回车，还是直接忽略。
      if (!payloadText.trim()) {
        if (!enterWhenEmptyCheckbox.checked) { text.focus(); return; }
        sending = true;
        sendButton.setAttribute("aria-busy", "true");
        try {
          await sendRequest({ key: "Return" });
          text.value = "";
          showToast("已发送回车");
          text.focus();
        } catch (error) {
          showToast("发送失败：" + error.message, true);
        } finally {
          sending = false;
          sendButton.removeAttribute("aria-busy");
        }
        return;
      }

      sending = true;
      sendButton.setAttribute("aria-busy", "true");
      sendButton.textContent = "发送中……";
      try {
        await sendRequest({ text: payloadText });
        addHistoryItem(payloadText);
        text.value = "";
        text.focus();
      } catch (error) {
        showToast("发送失败：" + error.message, true);
      } finally {
        sending = false;
        sendButton.removeAttribute("aria-busy");
        sendButton.textContent = "发送";
      }
    }

    sendButton.addEventListener("click", sendText);
    clearButton.addEventListener("click", () => { text.value = ""; text.focus(); });

    sendOnEnterCheckbox.checked = localStorage.getItem(ENTER_MODE_STORAGE_KEY) === "true";
    sendOnEnterCheckbox.addEventListener("change", () => {
      localStorage.setItem(ENTER_MODE_STORAGE_KEY, sendOnEnterCheckbox.checked ? "true" : "false");
      text.focus();
    });

    enterWhenEmptyCheckbox.checked = localStorage.getItem(EMPTY_ENTER_STORAGE_KEY) === "true";
    enterWhenEmptyCheckbox.addEventListener("change", () => {
      localStorage.setItem(EMPTY_ENTER_STORAGE_KEY, enterWhenEmptyCheckbox.checked ? "true" : "false");
      text.focus();
    });

    text.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && sendOnEnterCheckbox.checked && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendText();
      }
    });

    /* ---------- 本地发送记录 ---------- */
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || "[]"); }
      catch { return []; }
    }
    function saveHistory(items) { localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(items)); }

    function renderHistory() {
      historyList.textContent = "";
      for (const item of loadHistory()) {
        const node = document.createElement("div");
        node.className = "historyItem";
        node.tabIndex = 0;
        node.textContent = item.text;
        node.title = "点击填回输入框";
        const refill = () => { text.value = item.text; text.focus(); };
        node.addEventListener("click", refill);
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); refill(); }
        });
        historyList.appendChild(node);
      }
    }

    function addHistoryItem(value) {
      const items = loadHistory().filter((item) => item.text !== value);
      items.unshift({ text: value, createdAt: new Date().toISOString() });
      saveHistory(items.slice(0, HISTORY_LIMIT));
      renderHistory();
    }

    clearHistoryButton.addEventListener("click", () => {
      saveHistory([]);
      renderHistory();
    });

    /* ---------- 启动 ---------- */
    function adoptUrlToken() {
      // http://host:port/?token=xxx 打开即完成配对；随后从地址栏抹掉 token。
      const params = new URLSearchParams(location.search);
      const urlToken = params.get("token");
      if (!urlToken) return;
      localStorage.setItem(TOKEN_STORAGE_KEY, urlToken);
      params.delete("token");
      const rest = params.toString();
      history.replaceState(null, "", location.pathname + (rest ? "?" + rest : ""));
    }

    async function checkPairing() {
      const token = getToken();
      if (!token) { showLock(); return; }
      try {
        const response = await fetch("api/ping?token=" + encodeURIComponent(token));
        if (response.ok) {
          unlock();
          return;
        }
        // 401 = 配对已被撤销，token 作废；网络错误则保留 token。
        if (response.status === 401) localStorage.removeItem(TOKEN_STORAGE_KEY);
      } catch {}
      showLock();
    }

    async function boot() {
      renderKeypad();
      renderDots();
      renderHistory();
      adoptUrlToken();
      try {
        const info = await fetch("api/auth-info").then((r) => r.json());
        if (info.ok && Number.isInteger(info.pinLength) && info.pinLength > 0) {
          pinLength = info.pinLength;
          renderDots();
        }
      } catch {}
      await checkPairing();
      text.focus();
    }

    boot();
  </script>
</body>
</html>
