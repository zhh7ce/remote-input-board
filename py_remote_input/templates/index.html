<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>远程输入板</title>
  <style>
    :root {
      --bg: #eef3f0;
      --ink: #16211d;
      --muted: #65716d;
      --line: #d9e2de;
      --accent: #0f7b5f;
      --danger: #b73535;
      --shadow: 0 18px 42px rgba(20, 38, 31, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(15, 123, 95, 0.18), transparent 34%),
        var(--bg);
      padding: 16px;
    }
    .shell { width: min(100%, 720px); margin: 0 auto; display: grid; gap: 14px; }
    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .composerHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    h1 { font-size: 17px; margin: 0; }
    .totalChars { color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .totalChars strong { color: var(--accent); font-size: 16px; }
    textarea {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 16px;
      color: var(--ink);
      background: #fbfdfc;
      font: inherit;
      font-size: 19px;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      overflow-wrap: break-word;
      box-shadow: 0 0 0 4px rgba(15, 123, 95, 0.12);
    }
    .options {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .options input { width: 20px; height: 20px; accent-color: var(--accent); }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    button {
      min-height: 56px;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }
    .sendButton { flex: 1; }
    button.secondary { color: var(--accent); background: rgba(15, 123, 95, 0.1); min-width: 96px; font-size: 15px; }
    button:disabled, button[aria-busy="true"] { opacity: 0.62; cursor: wait; }
    .statusbar {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 14px;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .statusbar.error { color: var(--danger); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
    .dot.online { background: var(--accent); }
    .dot.offline { background: var(--danger); }
    .historyHeader { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .historyHeader h2 { margin: 0; font-size: 16px; }
    .historyHeader button {
      min-height: 0;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(22, 33, 29, 0.08);
      font-size: 13px;
      font-weight: 700;
    }
    .historyList { display: grid; gap: 8px; max-height: 32vh; overflow: auto; }
    .historyList:empty::after {
      content: "暂无发送记录";
      color: var(--muted);
      font-size: 14px;
      padding: 4px 2px 10px;
    }
    .historyItem {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: #fbfdfc;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.45;
      cursor: pointer;
    }
    .historyItem:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 123, 95, 0.12);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="card">
      <div class="composerHeader">
        <h1>远程输入板</h1>
        <span class="totalChars">累计 <strong id="totalChars">0</strong> 字</span>
      </div>
      <textarea id="text" autofocus placeholder="在这里输入文字，点「发送」就会输入到电脑当前光标处……"></textarea>
      <label class="options">
        <input type="checkbox" id="sendOnEnter">
        回车直接发送（Shift+回车换行）
      </label>
      <div class="actions">
        <button class="sendButton" id="sendButton" type="button">发送</button>
        <button class="secondary" id="clearButton" type="button">清空</button>
      </div>
    </section>

    <section class="card statusbar" id="statusbar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">正在连接……</span>
    </section>

    <section class="card">
      <div class="historyHeader">
        <h2>发送记录</h2>
        <button id="clearHistory" type="button">清空记录</button>
      </div>
      <div class="historyList" id="historyList"></div>
    </section>
  </div>

  <script>
    const text = document.getElementById("text");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const statusbar = document.getElementById("statusbar");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const totalCharsNode = document.getElementById("totalChars");
    const historyList = document.getElementById("historyList");
    const clearHistoryButton = document.getElementById("clearHistory");
    const sendOnEnterCheckbox = document.getElementById("sendOnEnter");

    const HISTORY_STORAGE_KEY = "remoteInput.history";
    const ENTER_MODE_STORAGE_KEY = "remoteInput.sendOnEnter";
    const TOTAL_CHARS_STORAGE_KEY = "remoteInput.totalChars";
    const HISTORY_LIMIT = 20;

    let socket = null;
    let reconnectTimer = null;
    let pingTimer = null;
    let requestSeq = 0;
    const pendingRequests = new Map();
    let sending = false;

    function setStatus(message, state) {
      statusText.textContent = message;
      statusbar.classList.toggle("error", state === "error");
      statusDot.className = "dot " + (state === "online" ? "online" : state === "offline" ? "offline" : "");
    }

    function genId() { return ++requestSeq; }

    /* ---------- WebSocket ---------- */
    function connectRealtime() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(protocol + "//" + location.host + "/ws");

      socket.addEventListener("open", () => {
        setStatus("已连接（实时通道），发送前请先在电脑上点好输入位置。", "online");
        schedulePing();
      });

      socket.addEventListener("message", (event) => {
        let payload;
        try { payload = JSON.parse(event.data); } catch { return; }
        if (typeof payload.id === "number" && pendingRequests.has(payload.id)) {
          const { resolve, reject } = pendingRequests.get(payload.id);
          pendingRequests.delete(payload.id);
          payload.ok ? resolve(payload) : reject(new Error(payload.error || "发送失败"));
        }
        if (typeof payload.totalChars === "number") updateTotalChars(payload.totalChars);
      });

      socket.addEventListener("close", () => {
        clearInterval(pingTimer);
        failAllPending(new Error("实时通道已断开"));
        setStatus("实时通道未连接，将改用 HTTP 发送。", "offline");
        scheduleReconnect();
      });

      socket.addEventListener("error", () => { try { socket.close(); } catch {} });
    }

    function scheduleReconnect() {
      if (reconnectTimer !== null) return;
      reconnectTimer = setTimeout(() => { reconnectTimer = null; connectRealtime(); }, 1000);
    }

    function schedulePing() {
      clearInterval(pingTimer);
      pingTimer = setInterval(() => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "ping" }));
        }
      }, 25000);
    }

    function failAllPending(error) {
      for (const { reject } of pendingRequests.values()) reject(error);
      pendingRequests.clear();
    }

    function sendRealtime(payloadText) {
      return new Promise((resolve, reject) => {
        const id = genId();
        pendingRequests.set(id, { resolve, reject });
        socket.send(JSON.stringify({ type: "type", id, text: payloadText }));
      });
    }

    async function sendViaHttp(payloadText) {
      const response = await fetch("/api/type", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: payloadText }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.ok) throw new Error(payload.error || "发送失败");
      return payload;
    }

    /* ---------- 发送 ---------- */
    async function sendText() {
      if (sending) return;
      const payloadText = text.value;
      if (!payloadText.trim()) {
        setStatus("请输入要发送的文字。", "error");
        text.focus();
        return;
      }
      sending = true;
      sendButton.setAttribute("aria-busy", "true");
      sendButton.textContent = "发送中……";
      const online = socket && socket.readyState === WebSocket.OPEN;
      if (!online) setStatus("正在通过 HTTP 发送……", "offline");
      try {
        const result = online ? await sendRealtime(payloadText) : await sendViaHttp(payloadText);
        addHistoryItem(payloadText);
        if (typeof result.totalChars === "number") {
          updateTotalChars(result.totalChars);
        } else {
          updateTotalChars(loadLocalTotalChars() + [...payloadText].length);
        }
        text.value = "";
        setStatus("已发送 " + [...payloadText].length + " 字，继续输入下一条吧。", "online");
        text.focus();
      } catch (error) {
        setStatus("发送失败：" + error.message, "error");
      } finally {
        sending = false;
        sendButton.removeAttribute("aria-busy");
        sendButton.textContent = "发送";
      }
    }

    sendButton.addEventListener("click", sendText);
    clearButton.addEventListener("click", () => { text.value = ""; text.focus(); });

    sendOnEnterCheckbox.checked = localStorage.getItem(ENTER_MODE_STORAGE_KEY) === "true";
    sendOnEnterCheckbox.addEventListener("change", () => {
      localStorage.setItem(ENTER_MODE_STORAGE_KEY, sendOnEnterCheckbox.checked ? "true" : "false");
      text.focus();
    });

    text.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && sendOnEnterCheckbox.checked && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendText();
      }
    });

    /* ---------- 累计字数 ---------- */
    function loadLocalTotalChars() {
      const value = Number.parseInt(localStorage.getItem(TOTAL_CHARS_STORAGE_KEY) || "0", 10);
      return Number.isFinite(value) && value > 0 ? value : 0;
    }
    function updateTotalChars(count) {
      const merged = Math.max(loadLocalTotalChars(), count);
      localStorage.setItem(TOTAL_CHARS_STORAGE_KEY, String(merged));
      totalCharsNode.textContent = merged.toLocaleString("zh-CN");
    }
    updateTotalChars(loadLocalTotalChars());

    async function loadServerTotalChars() {
      try {
        const response = await fetch("/api/stats");
        const payload = await response.json();
        if (payload.ok && typeof payload.totalChars === "number") updateTotalChars(payload.totalChars);
      } catch {}
    }

    /* ---------- 本地发送记录 ---------- */
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || "[]"); }
      catch { return []; }
    }
    function saveHistory(items) { localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(items)); }

    function renderHistory() {
      historyList.textContent = "";
      for (const item of loadHistory()) {
        const node = document.createElement("div");
        node.className = "historyItem";
        node.tabIndex = 0;
        node.textContent = item.text;
        node.title = "点击填回输入框";
        const refill = () => { text.value = item.text; text.focus(); };
        node.addEventListener("click", refill);
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); refill(); }
        });
        historyList.appendChild(node);
      }
    }

    function addHistoryItem(value) {
      const items = loadHistory().filter((item) => item.text !== value);
      items.unshift({ text: value, createdAt: new Date().toISOString() });
      saveHistory(items.slice(0, HISTORY_LIMIT));
      renderHistory();
    }

    clearHistoryButton.addEventListener("click", () => {
      saveHistory([]);
      renderHistory();
    });

    renderHistory();
    loadServerTotalChars();
    connectRealtime();
    text.focus();
  </script>
</body>
</html>
