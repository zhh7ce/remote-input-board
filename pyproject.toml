[project]
name = "remote-input-board"
version = "0.1.0"
description = "Use a phone browser as a remote text input panel for Linux (Wayland, via wtype)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
remote-input-board = "py_remote_input.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.uv]

[tool.setuptools.packages.find]
include = ["py_remote_input*"]

[tool.setuptools.package-data]
py_remote_input = ["templates/*.html"]
